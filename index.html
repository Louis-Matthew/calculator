<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <div class="display"></div>
      <div class="buttons">
        <button id="clear">AC</button>
        <button id="delete"><ion-icon name="backspace-outline"></ion-icon></button>
        <button class="operator" id="divide">&divide;</button>
        <button class="operator" id="add">+</button>

        <button class="number" id="9">9</button>
        <button class="number" id="8">8</button>
        <button class="number" id="7">7</button>

        <button class="operator" id="multiply">x</button>

        <button class="number" id="6">6</button>
        <button class="number" id="5">5</button>
        <button class="number" id="4">4</button>

        <button class="operator" id="subtract">-</button>

        <button class="number" id="3">3</button>
        <button class="number" id="2">2</button>
        <button class="number" id="1">1</button>
        
        <button id="calculate">=</button>

        <button class="number" id="0">0</button>
        <button class="number" id="decimal">.</button>
      </div>
    </div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
