<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <div class="display">4289352</div>
      <div class="buttons">
        <button>AC</button>
        <button><ion-icon name="backspace-outline"></ion-icon></button>
        <button>&divide;</button>
        <button>+</button>
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button>x</button>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button>-</button>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button>=</button>
        <button>0</button>
      </div>
    </div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
